name: Checkbook NYC dated payments

# Builds data/contract-search.json: EVERY construction registered contract as a
# searchable record carrying its contract-level fields, paid_to_date
# (prime_vendor_spent_to_date) and pct_paid_to_date. A DEFINED subset, every
# construction registered contract of $500,000 or more registered since 2019 that
# is still open or closed within the past year (closure judged by the registered
# end date), ALSO carries a dated disbursement stream plus velocity metrics
# (first-payment lag, days-to-50pct/90pct paid, monthly cumulative curve), pulled
# one contract at a time from Checkbook NYC Spending. Source of truth for the contract-search
# page. Mirrors site/checkbook.yml: stdlib-only Python (urllib + xml), no extra
# deps, generous backoff. The build ALWAYS writes the file (even on a thin pull);
# the commit step rebases before pushing and never fails on a missing pathspec.
# Never call the live API outside the Action (Checkbook is POST-XML, no CORS).
#
# SWEEP STRATEGY (bulk category pull, fast):
#   Stage 1 pulls the construction registered-contract universe (FY2021-2025).
#   Stage 2 pulls Spending in BULK, filtered AT THE SOURCE by spending category so
#   the volume is tractable (tens of thousands of rows per fiscal year, not the
#   ~3.2M citywide). For each fiscal year it POSTs Spending with search_criteria
#   {spending_category=Contract, fiscal_year=FY}, pages in 20000-row chunks,
#   dedupes on document_id, and buckets every check by contract_id, keeping only
#   the contract_ids that exist in the Stage-1 universe. This replaces the dead
#   per-contract method (one POST per contract), which Checkbook rate-limited so
#   hard a ~1000-contract run took 3 hours and was cancelled. The bulk pull runs
#   in a few minutes.
#
#   CATEGORY CODE (authoritative, from the Checkbook open-source repo):
#   The Spending API filter field is `spending_category`. In the API config
#   (source/web/.../checkbook_api/src/config/spending.json) it maps to
#   `spending_category_code@checkbook:spending_category_subven`. The value is
#   resolved by CheckbookSolrQueryBase::get_spending_category_mapping(), which
#   runs (citywide):
#     SELECT spending_category_id FROM ref_spending_category
#     WHERE spending_category_code ~* '(^<value>$)'
#        OR spending_category_name ~* '(^<value>$)'
#   The match is a FULLY-ANCHORED, case-insensitive regex against the code OR the
#   name. The citywide category map (checkbook_project SpendingUtil::$spendingCategories)
#   is 1=>Contract, 2=>Payroll, 3=>Capital, 4=>Other, 5=>Trust & Agency. Our
#   universe is registered EXPENSE contracts whose disbursements are "Contract"
#   spending (id 1), so the value is the literal "Contract" (matches ^Contract$
#   against spending_category_name). The earlier bulk attempt used "c", which
#   matches NEITHER the code nor the name under the anchored ^c$ regex -> NULL ->
#   the category filter silently dropped, so it under-matched. We pass the full
#   word "Contract". We bucket by contract_id afterward, so slight over-pull is
#   harmless. CATEGORY_CODES is a list so a second code can be added if a future
#   live check shows "Contract" alone misses disbursements (e.g. add "Expense"),
#   without touching the rest of the pull.
#
#   JOIN KEY: on Spending, the contract_id response column maps to
#   `reference_document_number`; on Contracts, prime_contract_id maps to
#   `contract_number`. These are the same identifier space (the registered
#   contract's document number), which is why the old per-contract method could
#   POST Spending with contract_id=<prime_contract_id> and match. We bucket bulk
#   Spending rows by their contract_id against the Stage-1 prime_contract_id set.
#
#   Every Stage-1 contract stays searchable; only the scoped subset is MARKED as
#   carrying dated timing (payments_swept) and drawn with a curve.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '20 7 * * *'   # 07:20 UTC daily (~2:20am New York). Moved off 06:50 to clear
                           # the doing-business job that also ran at 06:50 (both push to main,
                           # so they raced). Runs after the 06:15 archive and 06:40 checkbook
                           # jobs, so awards.json and contract data are fresh.

permissions:
  contents: write

jobs:
  payments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build contract-search.json
        run: |
          mkdir -p data
          python3 - <<'PYEOF'
          import json, sys, time, re, os, datetime
          import urllib.request, urllib.error
          import xml.etree.ElementTree as ET

          API = "https://www.checkbooknyc.com/api"
          FYS = [2021, 2022, 2023, 2024, 2025]   # Stage-1 universe window
          MAX_RECORDS = 1000        # Contracts paging chunk (server max)
          CONSTR_RE = re.compile(r"constr|engineer|architect|paving|excavat|infrastructure", re.I)

          # ---- BULK SPENDING CATEGORY PULL ------------------------------------
          # Source-side category filter for Stage 2. CATEGORY_FIELD is the API
          # search-criteria name; CATEGORY_CODES are the value(s). "Contract" is
          # the citywide spending category (id 1) for disbursements against
          # registered expense/contract registrations; the API resolves it with a
          # fully-anchored case-insensitive regex against spending_category_name.
          # It is a LIST so a second value (e.g. "Expense") can be added if a live
          # check ever shows "Contract" alone misses our disbursements; we bucket
          # by contract_id afterward so over-pull is harmless. See header comment.
          CATEGORY_FIELD = "spending_category"
          CATEGORY_CODES = ["Contract"]
          SPENDING_PAGE = 20000     # bulk Spending paging chunk (rows per POST)
          SPENDING_PAGE_CAP = 60    # generous per-(category,FY) page cap -> up to 1.2M rows/FY

          # ---- DATED-PAYMENT SCOPE (tunable) ----------------------------------
          # The dated-payment universe is DEFINED, not capped to a count: every
          # construction registered contract whose value is at least AMOUNT_FLOOR,
          # which was registered in SINCE_YEAR or later, AND which is either still
          # open or closed within the last CLOSED_WITHIN_DAYS days draws a dated
          # check pull. Value = prime_contract_current_amount, falling back to
          # prime_contract_original_amount. Registration year =
          # prime_contract_registration_date year, falling back to
          # prime_contract_start_date year. Closure is judged by
          # prime_contract_end_date (the registered/scheduled end date; the public
          # record has no actual-completion field): a contract is INCLUDED when its
          # end date is missing/unparseable (treat as open) OR is no more than
          # CLOSED_WITHIN_DAYS in the past; it is EXCLUDED only when its end date is
          # more than CLOSED_WITHIN_DAYS before today. "today" is computed at
          # runtime as the current UTC date.
          AMOUNT_FLOOR      = 500_000   # contract value floor for the dated pull
          SINCE_YEAR        = 2019      # earliest registration year for the dated pull
          CLOSED_WITHIN_DAYS = 365      # include closed contracts only if end date is within this many days of today

          # ---- BULK SPENDING PACING -------------------------------------------
          # One POST per page (SPENDING_PAGE rows) per (category, fiscal_year).
          # Light pacing between pages plus the generous post() retry/backoff keep
          # rate-limiting from stalling the (now short) run.
          SPENDING_PACE = 0.5        # seconds between bulk Spending pages

          MAX_BYTES = 1_400_000

          # ---- normalizer: byte-for-byte equivalent of the /vendors/ page normName() ----
          # JS: (s||'').trim().replace(/\s+/g,' ').toUpperCase().replace(/[.,;:&/\\'"`\-\s]+$/,'').trim()
          _TRAIL = re.compile(r"[.,;:&/\\'\"`\-\s]+$")
          def norm_name(s):
              if s is None:
                  s = ""
              s = s.strip()
              s = re.sub(r"\s+", " ", s)
              s = s.upper()
              s = _TRAIL.sub("", s)
              return s.strip()

          def log(*a):
              print(*a, flush=True)

          def build_request_xml(type_of_data, columns, criteria, records_from, max_records=None):
              if max_records is None:
                  max_records = MAX_RECORDS
              crit_xml = ""
              for nm, ty, val in criteria:
                  crit_xml += ("<criteria><name>%s</name><type>%s</type><value>%s</value></criteria>"
                               % (nm, ty, val))
              cols_xml = "".join("<column><name>%s</name></column>" % c for c in columns)
              return ('<?xml version="1.0"?>'
                      "<request>"
                      "<type_of_data>%s</type_of_data>"
                      "<records_from>%d</records_from>"
                      "<max_records>%d</max_records>"
                      "<search_criteria>%s</search_criteria>"
                      "<response_columns>%s</response_columns>"
                      "</request>") % (type_of_data, records_from, max_records, crit_xml, cols_xml)

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36 "
                "ConcreteIndex/1.0 (+https://concreteindex.co)")

          def post(xml_body, tries=6):
              last = None
              for attempt in range(tries):
                  try:
                      req = urllib.request.Request(
                          API, data=xml_body.encode("utf-8"),
                          headers={"Content-Type": "text/xml", "Accept": "text/xml",
                                   "User-Agent": UA},
                          method="POST")
                      with urllib.request.urlopen(req, timeout=120) as r:
                          return r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      last = e
                      log("  POST attempt %d failed: HTTP %s" % (attempt + 1, e.code))
                      if e.code in (403, 429):   # rate-limited: generous backoff
                          time.sleep(min(60, 8 * (2 ** attempt)))
                      else:
                          time.sleep(3 * (attempt + 1))
                  except Exception as e:
                      last = e
                      log("  POST attempt %d failed: %s" % (attempt + 1, e))
                      time.sleep(3 * (attempt + 1))
              raise RuntimeError("POST failed after %d tries: %s" % (tries, last))

          def parse_records(xml_text):
              # Returns (recs, raw). recs is None on hard error (parse fail or API
              # <result>failure</result>); [] on a clean empty page. Structure of
              # the parser is identical to checkbook.yml: row elements inside
              # <result_records> are detected by "all children are leaves".
              try:
                  root = ET.fromstring(xml_text)
              except ET.ParseError as e:
                  log("  XML parse error:", e)
                  log("  first 600 chars:", xml_text[:600])
                  return None, xml_text
              result = None
              for el in root.iter():
                  if el.tag.lower() == "result":
                      result = (el.text or "").strip().lower()
                      break
              if result == "failure":
                  msgs = []
                  for m in root.iter():
                      if m.tag.lower() == "description":
                          msgs.append((m.text or "").strip())
                  log("  API returned failure. messages:")
                  for m in msgs:
                      log("    -", m)
                  return None, xml_text
              container = None
              for el in root.iter():
                  if el.tag.lower() == "result_records":
                      container = el
                      break
              recs = []
              if container is not None:
                  def is_row(e):
                      kids = list(e)
                      return len(kids) > 0 and all(len(list(k)) == 0 for k in kids)
                  candidates = []
                  for child in container:
                      if is_row(child):
                          candidates.append(child)
                      else:
                          for gc in child:
                              if is_row(gc):
                                  candidates.append(gc)
                  for rec in candidates:
                      d = {}
                      for c in rec:
                          d[c.tag.lower()] = (c.text or "").strip()
                      if d:
                          recs.append(d)
              return recs, xml_text

          def fetch_all(type_of_data, columns, criteria):
              # Generic pager for the Stage-1 Contracts pull. criteria is a
              # fully-formed list of (name,type,value).
              rows = []
              raw_first = None
              rf = 1
              page = 0
              while True:
                  xml = build_request_xml(type_of_data, columns, criteria, rf)
                  resp = post(xml)
                  recs, raw = parse_records(resp)
                  if page == 0:
                      raw_first = raw
                  if recs is None:
                      time.sleep(0.7)
                      return rows, raw_first
                  rows.extend(recs)
                  got = len(recs)
                  page += 1
                  if got < MAX_RECORDS:
                      break
                  rf += MAX_RECORDS
                  time.sleep(1.0)   # pace paging to avoid 403 rate-limit
                  if rf > 500000:
                      log("  WARNING paging cap hit for", type_of_data, criteria)
                      break
              time.sleep(0.7)       # pace between request groups
              return rows, raw_first

          def to_int_amount(s):
              if not s:
                  return 0
              s = s.replace(",", "").replace("$", "").strip()
              try:
                  return int(round(float(s)))
              except ValueError:
                  return 0

          def parse_date(s):
              # Checkbook dates come as YYYY-MM-DD (sometimes with a time). Return a
              # date or None. Robust to a couple of stray formats.
              if not s:
                  return None
              s = s.strip()
              m = re.match(r"(\d{4})-(\d{2})-(\d{2})", s)
              if m:
                  try:
                      return datetime.date(int(m.group(1)), int(m.group(2)), int(m.group(3)))
                  except ValueError:
                      return None
              m = re.match(r"(\d{1,2})/(\d{1,2})/(\d{4})", s)
              if m:
                  try:
                      return datetime.date(int(m.group(3)), int(m.group(1)), int(m.group(2)))
                  except ValueError:
                      return None
              return None

          def iso(d):
              return d.isoformat() if d else None

          def month_key(d):
              return "%04d-%02d" % (d.year, d.month)

          def load_aliases(path):
              with open(path) as f:
                  raw = json.load(f)
              v2p = {}
              for g in raw:
                  for v in g.get("variants", []):
                      nv = norm_name(v)
                      if nv:
                          v2p[nv] = g["parent"]
              return v2p

          alias_path = "site/data/vendor-aliases.json"
          if not os.path.exists(alias_path):
              alias_path = "data/vendor-aliases.json"
          variant_to_parent = load_aliases(alias_path)
          log("Loaded %d normalized variant keys from %s" % (len(variant_to_parent), alias_path))

          def resolve_vendor(name):
              k = norm_name(name)
              parent = variant_to_parent.get(k)
              if parent:
                  return parent
              return (name or "").strip()

          # =================================================================
          # STAGE 1 - the construction registered-contracts universe.
          # Reuses the EXACT criteria/columns/construction filter from
          # checkbook.yml so this job and the vendor job share one definition of
          # "construction registered contract". Adds the contract-level date and
          # award fields the velocity math needs.
          # =================================================================
          contracts_cols = ["prime_vendor", "prime_contract_id", "prime_contracting_agency",
                            "prime_contract_industry", "prime_contract_current_amount",
                            "prime_vendor_spent_to_date", "prime_contract_original_amount",
                            "prime_contract_purpose", "prime_contract_pin",
                            "prime_contract_award_method",
                            "prime_contract_registration_date",
                            "prime_contract_start_date", "prime_contract_end_date"]

          # category=expense + status=registered are both accepted on Contracts.
          CONTRACTS_BASE = [("category", "value", "expense"),
                            ("status", "value", "registered")]

          def c(r, k, default=""):
              return r.get(k, default) or default

          all_contracts = []
          for fy in FYS:
              log("--- Contracts FY%d ---" % fy)
              crit = CONTRACTS_BASE + [("fiscal_year", "value", str(fy))]
              rows, _ = fetch_all("Contracts", contracts_cols, crit)
              log("  %d contract rows" % len(rows))
              all_contracts.extend(rows)

          # Construction filter, client-side on the returned industry text (the
          # server industry filter needs a 2-char code we do not have; identical
          # decision to checkbook.yml).
          def keep_c(r):
              return bool(CONSTR_RE.search(c(r, "prime_contract_industry")))

          constr = [r for r in all_contracts if keep_c(r)]
          log("After construction filter: %d contracts" % len(constr))

          # Dedupe on prime_contract_id, keeping the row with the max registered
          # (current) amount (latest, most-complete view of the contract).
          by_cid = {}
          for r in constr:
              cid = c(r, "prime_contract_id")
              if not cid:
                  continue
              amt = to_int_amount(c(r, "prime_contract_current_amount"))
              prev = by_cid.get(cid)
              if prev is None or amt > to_int_amount(c(prev, "prime_contract_current_amount")):
                  by_cid[cid] = r
          log("Distinct construction contract_ids: %d" % len(by_cid))

          # Rank by current amount so the largest contracts keep their spend curve
          # first if the payload ever has to be trimmed for size (Stage 5).
          ranked = sorted(by_cid.items(),
                          key=lambda kv: -to_int_amount(c(kv[1], "prime_contract_current_amount")))

          # =================================================================
          # STAGE 2 - BULK Spending pull, source-filtered by spending category.
          #
          # For each fiscal year, POST Spending with search_criteria
          # {spending_category=<code>, fiscal_year=FY}, page in SPENDING_PAGE-row
          # chunks, dedupe on document_id, bucket every check by contract_id, and
          # keep only contract_ids in the Stage-1 universe (universe_ids). One
          # bulk page-through per (category, FY); the source-side category filter
          # keeps volume tractable. The API record_count and the kept-row count
          # are logged per (category, FY) so the run reveals whether the filter
          # matched. See the header comment for the category-code derivation.
          #
          # SCOPE (separate concern): which contracts are MARKED as carrying dated
          # coverage / drawn with a curve is the owner's rule -- value >=
          # AMOUNT_FLOOR, registered SINCE_YEAR+, open or closed within
          # CLOSED_WITHIN_DAYS. A contract OUTSIDE that scope keeps
          # payments_swept=False and null dated fields even if checks were pulled.
          # The scope helpers below are reused unchanged for that marking in
          # Stage 4.
          # =================================================================
          spending_cols = ["issue_date", "check_amount", "contract_id", "document_id",
                           "payee_name", "agency", "fiscal_year", "mocs_registered"]

          def contract_value(r):
              # Value for the scope test: current amount, fall back to original.
              cur = to_int_amount(c(r, "prime_contract_current_amount"))
              return cur if cur > 0 else to_int_amount(c(r, "prime_contract_original_amount"))

          def reg_year(r):
              # Registration year for the scope test: registration date year,
              # falling back to start date year. None if neither parses.
              d = parse_date(c(r, "prime_contract_registration_date"))
              if d is None:
                  d = parse_date(c(r, "prime_contract_start_date"))
              return d.year if d else None

          # "today" is the current UTC date; the closed-recently cutoff is
          # CLOSED_WITHIN_DAYS before it. Computed once at runtime.
          today = datetime.datetime.now(datetime.timezone.utc).date()
          closed_cutoff = today - datetime.timedelta(days=CLOSED_WITHIN_DAYS)

          def open_or_recently_closed(r):
              # Closure judged by prime_contract_end_date (registered/scheduled end;
              # no actual-completion field exists). Include when the end date is
              # missing/unparseable (treat as open) OR is on/after the cutoff
              # (open: end date in the future or unknown; or closed within the past
              # CLOSED_WITHIN_DAYS). Exclude only when the end date is more than
              # CLOSED_WITHIN_DAYS in the past.
              end_d = parse_date(c(r, "prime_contract_end_date"))
              if end_d is None:
                  return True
              return end_d >= closed_cutoff

          def in_scope(r):
              if contract_value(r) < AMOUNT_FLOOR:
                  return False
              ry = reg_year(r)
              if ry is None or ry < SINCE_YEAR:
                  return False
              return open_or_recently_closed(r)

          # The set of contract_ids in the Stage-1 universe; bulk Spending checks
          # are kept only when their contract_id is one of these.
          universe_ids = set(by_cid.keys())
          contracts_in_scope = sum(1 for _cid, r in ranked if in_scope(r))
          log("Dated scope: %d contracts of >= $%d registered in %d+ open or closed since %s "
              "(of %d construction contracts)"
              % (contracts_in_scope, AMOUNT_FLOOR, SINCE_YEAR, closed_cutoff.isoformat(), len(by_cid)))

          def read_record_count(xml_text):
              # The API echoes a <record_count> (total matching rows for the
              # criteria) in the response envelope. Used only for logging.
              m = re.search(r"<record_count>\s*(\d+)\s*</record_count>", xml_text)
              return int(m.group(1)) if m else None

          # contract_id -> {document_id -> (date, amount)} ; dedupe on document_id.
          payments = {}
          spending_rows_seen = 0     # checks returned across all bulk pages
          spending_rows_kept = 0     # deduped checks attributed to a universe contract
          per_fy_stats = []          # [(category, fy, record_count, seen, kept), ...]

          for cat in CATEGORY_CODES:
              for fy in FYS:
                  log("--- Spending (category=%s) FY%d ---" % (cat, fy))
                  rf = 1
                  page = 0
                  fy_seen = 0
                  fy_kept = 0
                  fy_record_count = None
                  while True:
                      xml = build_request_xml(
                          "Spending", spending_cols,
                          [(CATEGORY_FIELD, "value", cat),
                           ("fiscal_year", "value", str(fy))],
                          rf, max_records=SPENDING_PAGE)
                      try:
                          resp = post(xml)
                      except Exception as e:
                          log("  category=%s FY%d page rf=%d POST raised, stopping FY: %s"
                              % (cat, fy, rf, e))
                          break
                      if fy_record_count is None:
                          fy_record_count = read_record_count(resp)
                      recs, _ = parse_records(resp)
                      if recs is None:
                          # API failure / parse error: log and stop this FY (the
                          # write still proceeds with whatever was gathered).
                          log("  category=%s FY%d page rf=%d returned no parseable "
                              "records, stopping FY" % (cat, fy, rf))
                          break
                      got = len(recs)
                      for r in recs:
                          spending_rows_seen += 1
                          fy_seen += 1
                          rcid = c(r, "contract_id")
                          if not rcid or rcid not in universe_ids:
                              continue   # not one of our construction contracts
                          doc = c(r, "document_id")
                          if not doc:
                              doc = "%s|%s|%s" % (rcid, c(r, "issue_date"), c(r, "check_amount"))
                          bucket = payments.setdefault(rcid, {})
                          if doc in bucket:
                              continue   # re-reported check: count once
                          d = parse_date(c(r, "issue_date"))
                          amt = to_int_amount(c(r, "check_amount"))
                          bucket[doc] = (d, amt)
                          spending_rows_kept += 1
                          fy_kept += 1
                      page += 1
                      if got < SPENDING_PAGE:
                          break
                      rf += SPENDING_PAGE
                      time.sleep(SPENDING_PACE)
                      if page >= SPENDING_PAGE_CAP:
                          log("  WARNING page cap (%d) hit for category=%s FY%d; "
                              "record_count=%s" % (SPENDING_PAGE_CAP, cat, fy, fy_record_count))
                          break
                  log("  category=%s FY%d: record_count=%s seen=%d kept=%d "
                      "(running kept=%d)"
                      % (cat, fy, fy_record_count, fy_seen, fy_kept, spending_rows_kept))
                  per_fy_stats.append([cat, fy, fy_record_count, fy_seen, fy_kept])
                  time.sleep(SPENDING_PACE)

          contracts_swept = len(payments)
          log("Bulk Spending complete: categories=%s seen=%d kept=%d "
              "contracts_with_checks=%d (universe=%d)"
              % (CATEGORY_CODES, spending_rows_seen, spending_rows_kept,
                 contracts_swept, len(universe_ids)))

          # =================================================================
          # STAGE 3 - best-effort bid_due_date from the City Record archive.
          # Joins City-Record pin -> Checkbook prime_contract_pin. Partial
          # coverage by design; never required. Read from the archived
          # awards.json the nightly archive job committed (no extra API call,
          # same-repo file). Skipped silently if absent.
          # =================================================================
          bid_due_by_pin = {}
          for ap in ("data/awards.json", "site/data/awards.json"):
              if os.path.exists(ap):
                  try:
                      aw = json.load(open(ap))
                      for row in aw:
                          pin = (row.get("pin") or "").strip()
                          dd = (row.get("due_date") or "").strip()
                          if pin and dd and pin not in bid_due_by_pin:
                              bid_due_by_pin[pin] = dd[:10]
                      log("Loaded %d pin->due_date pairs from %s" % (len(bid_due_by_pin), ap))
                  except Exception as e:
                      log("  could not read awards for bid_due_date:", e)
                  break

          def lookup_bid_due(pin):
              pin = (pin or "").strip()
              if not pin:
                  return None
              if pin in bid_due_by_pin:
                  return bid_due_by_pin[pin]
              # loose contains-match either direction (pins are partially coverable)
              for k, v in bid_due_by_pin.items():
                  if k and (k in pin or pin in k):
                      return v
              return None

          # =================================================================
          # STAGE 4 - records.
          #
          # EVERY construction contract becomes a searchable record carrying its
          # contract-level fields plus paid_to_date (= prime_vendor_spent_to_date,
          # available for all contracts) and pct_paid_to_date (paid_to_date /
          # current amount, falling back to original). These are what the page's
          # "Paid to date" column, "% paid" value, and sort all use, so every row
          # is consistent.
          #
          # EVERY contract in the SCOPED subset that drew a check ADDITIONALLY
          # carries the dated velocity metrics and the monthly cumulative spend
          # curve from its Checkbook disbursement stream (payments_swept=True). A
          # contract with no dated stream (out of scope, or scoped but no check
          # found / skipped) has those dated fields null and payments_swept=False.
          # =================================================================
          def build_record(cid, r):
              reg_d = parse_date(c(r, "prime_contract_registration_date"))
              start_d = parse_date(c(r, "prime_contract_start_date"))
              end_d = parse_date(c(r, "prime_contract_end_date"))
              original = to_int_amount(c(r, "prime_contract_original_amount"))
              current = to_int_amount(c(r, "prime_contract_current_amount"))
              spent_to_date = to_int_amount(c(r, "prime_vendor_spent_to_date"))
              vendor = resolve_vendor(c(r, "prime_vendor"))
              agency = c(r, "prime_contracting_agency")
              category = c(r, "prime_contract_industry")
              award_method = c(r, "prime_contract_award_method")
              pin = c(r, "prime_contract_pin")
              purpose = c(r, "prime_contract_purpose")

              # Denominator: current (registered) amount, fall back to original.
              denom = current or original or 0

              # pct_paid_to_date is the CONTRACT-RECORD figure for EVERY contract:
              # spent-to-date over the current amount. This is the single source
              # the table column, the % paid, and the sort all share.
              pct_paid_to_date = round(spent_to_date / denom, 4) if denom > 0 else None

              rec = {
                  "contract_id": cid,
                  "vendor": vendor,
                  "agency": agency,
                  "category": category,
                  "award_method": award_method,
                  "registration_date": iso(reg_d),
                  "start_date": iso(start_d),
                  "end_date": iso(end_d),            # SCHEDULED end (not actual completion)
                  "bid_due_date": lookup_bid_due(pin),   # best-effort, may be null
                  "original_amount": original,
                  "current_amount": current,
                  "paid_to_date": spent_to_date,         # contract-record figure (ALL contracts)
                  "pct_paid_to_date": pct_paid_to_date,  # paid_to_date / current (ALL contracts)
              }

              # The bulk pull gathers checks for ANY universe contract, but the
              # owner's scope decides which contracts are MARKED as carrying dated
              # coverage: value >= AMOUNT_FLOOR, registered SINCE_YEAR+, open or
              # closed within CLOSED_WITHIN_DAYS. A contract outside that scope
              # stays payments_swept=False with null dated fields EVEN IF checks
              # were pulled (the scope defines what we show as dated).
              docs = payments.get(cid) if in_scope(r) else None
              swept = bool(docs)
              if not swept:
                  # No dated stream (out of scope, or in scope with no check found):
                  # searchable with contract-level amounts, no dated timing.
                  rec.update({
                      "payments_swept": False,
                      "first_payment_lag_days": None,
                      "days_to_50pct_paid": None,
                      "days_to_90pct_paid": None,
                      "payment_count": None,
                      "total_paid": None,                # dated sum (none swept)
                      "first_payment_date": None,
                      "last_payment_date": None,
                      "monthly_cumulative": None,
                  })
                  return rec

              # Swept contract: build the dated stream + velocity metrics. Drop
              # entries with no usable date from the timeline but still count their
              # dollars in total_paid (a check with no date is still cash out).
              dated = []
              undated_amt = 0
              for doc, (d, amt) in docs.items():
                  if d is not None:
                      dated.append((d, amt))
                  else:
                      undated_amt += amt
              dated.sort(key=lambda x: x[0])

              total_paid = sum(a for _, a in dated) + undated_amt
              payment_count = len(docs)
              first_payment_date = dated[0][0] if dated else None
              last_payment_date = dated[-1][0] if dated else None

              first_payment_lag_days = None
              if reg_d and first_payment_date:
                  first_payment_lag_days = (first_payment_date - reg_d).days

              # Walk the cumulative dated stream from registration to find the first
              # date at which cumulative paid crosses 50% / 90% of denom.
              days_to_50pct_paid = None
              days_to_90pct_paid = None
              if reg_d and denom > 0 and dated:
                  cum = 0
                  for d, amt in dated:
                      cum += amt
                      if days_to_50pct_paid is None and cum >= 0.50 * denom:
                          days_to_50pct_paid = (d - reg_d).days
                      if days_to_90pct_paid is None and cum >= 0.90 * denom:
                          days_to_90pct_paid = (d - reg_d).days
                          break

              # Compact monthly cumulative spend series: [["YYYY-MM", cum_dollars], ...]
              monthly = []
              if dated:
                  by_month = {}
                  for d, amt in dated:
                      by_month[month_key(d)] = by_month.get(month_key(d), 0) + amt
                  cum = 0
                  for mk in sorted(by_month):
                      cum += by_month[mk]
                      monthly.append([mk, cum])

              rec.update({
                  "payments_swept": True,
                  "first_payment_lag_days": first_payment_lag_days,
                  "days_to_50pct_paid": days_to_50pct_paid,
                  "days_to_90pct_paid": days_to_90pct_paid,
                  "payment_count": payment_count,
                  "total_paid": total_paid,              # sum of dated checks (+ undated $)
                  "first_payment_date": iso(first_payment_date),
                  "last_payment_date": iso(last_payment_date),
                  "monthly_cumulative": monthly,
              })
              return rec

          # Build ALL Stage-1 records (every construction contract is searchable).
          records = [build_record(cid, r) for cid, r in ranked]

          # Reconciliation signal (swept contracts only): how often sum-of-checks
          # (total_paid) tracks the contract-record prime_vendor_spent_to_date.
          # Reported in meta, not used to gate a row (the two can legitimately
          # differ: spent_to_date can lag or include non-check spend).
          recon_close = 0
          recon_have_both = 0
          for rec in records:
              ptd = rec["paid_to_date"]
              tp = rec["total_paid"]
              if ptd and tp and ptd > 0 and tp > 0:
                  recon_have_both += 1
                  if abs(tp - ptd) <= max(1000, int(0.05 * ptd)):
                      recon_close += 1
          recon_pct = round(recon_close / recon_have_both, 4) if recon_have_both else None

          contracts_with_dated_payments = sum(1 for rec in records
                                              if rec.get("payments_swept") and (rec["payment_count"] or 0) > 0)

          meta = {
              "generated": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "source": ("Checkbook NYC API (checkbooknyc.com): Registered Contracts (expense) "
                         "for the contract universe and a bulk Spending pull filtered at the "
                         "source by spending category (Contract) for dated disbursements, "
                         "bucketed by contract_id"),
              "fiscal_years": FYS,
              "sweep_strategy": ("bulk Spending filtered at the source by spending_category, "
                                 "paged per fiscal year, deduped on document_id, bucketed by "
                                 "contract_id, kept where the contract is in the construction "
                                 "universe; dated coverage marked only for contracts of at least "
                                 "the amount floor registered since the scope year that are open "
                                 "or closed within the past year"),
              "category_field": CATEGORY_FIELD,
              "category_codes": CATEGORY_CODES,
              "spending_rows_per_fy": [
                  {"category": s[0], "fiscal_year": s[1], "record_count": s[2],
                   "rows_seen": s[3], "rows_kept": s[4]}
                  for s in per_fy_stats
              ],
              "amount_floor": AMOUNT_FLOOR,
              "since_year": SINCE_YEAR,
              "closed_within_days": CLOSED_WITHIN_DAYS,
              "contracts": len(records),
              "contracts_in_scope": contracts_in_scope,
              "contracts_with_dated_payments": contracts_with_dated_payments,
              "contracts_swept": contracts_swept,
              "spending_rows_seen": spending_rows_seen,
              "spending_rows_kept": spending_rows_kept,
              "recon_pct_total_paid_vs_spent_to_date": recon_pct,
              "coverage_note": ("Dated payment timing (the spend curve and velocity) covers "
                                "construction contracts of $500,000 or more registered since 2019 "
                                "that are open or closed within the past year, with closure judged by "
                                "the registered end date. All registered construction contracts remain "
                                "searchable with their amounts and paid-to-date; paid-to-date and "
                                "percent paid come from the City's registered-contract record and "
                                "cover every contract in the index."),
              "coverage_notes": [
                  "Universe is construction registered contracts (category=expense, "
                  "status=registered, industry matches construction) registered in FY2021-2025.",
                  "Paid to date and percent paid are the City's registered-contract figures "
                  "(prime_vendor_spent_to_date over current amount) and cover every contract.",
                  "Dated payment timing covers construction contracts of $500,000 or more "
                  "registered since 2019 that are open or closed within the past year (closure "
                  "judged by the registered end date); their checks come from a bulk Checkbook NYC "
                  "Spending pull filtered at the source by spending category, bucketed by "
                  "contract_id and deduped on document_id.",
                  "Where a contract is outside that scope, or drew no disbursement, the spend "
                  "curve and velocity read as a dash; its paid-to-date and percent paid still "
                  "come from the contract record.",
                  "end_date is the contract's SCHEDULED end, not actual completion.",
                  "bid_due_date is a best-effort City Record pin join with partial coverage; "
                  "null where no match.",
                  "Velocity denominators use current (registered) amount, falling back to "
                  "original; days_to_50pct/90pct are null when never reached in the dated stream.",
                  "For dated contracts, total_paid is the dated check sum and can differ from "
                  "paid_to_date; recon_pct reports how closely they agree.",
                  "No location/borough field is published for these records by design.",
              ],
          }

          out = {"meta": meta, "contracts": records}

          # If too big, drop monthly_cumulative from the smaller swept records
          # first (the largest contracts keep their curve), then from all.
          payload = json.dumps(out, separators=(",", ":"), ensure_ascii=False)
          if len(payload.encode("utf-8")) > MAX_BYTES:
              for rec in reversed(records):
                  if rec.get("monthly_cumulative"):
                      rec["monthly_cumulative"] = None
                  if len(json.dumps(out, separators=(",", ":"), ensure_ascii=False).encode("utf-8")) <= MAX_BYTES:
                      break
              meta["truncated"] = True
              payload = json.dumps(out, separators=(",", ":"), ensure_ascii=False)

          log("=== SUMMARY ===")
          log("contracts=%d in_scope=%d dated=%d swept=%d seen=%d kept=%d recon=%s bytes=%d"
              % (len(records), contracts_in_scope, contracts_with_dated_payments,
                 contracts_swept, spending_rows_seen,
                 spending_rows_kept, recon_pct, len(payload.encode("utf-8"))))

          # SOFT quality gate: on a thin/degraded pull, LOG a warning but ALWAYS
          # write the file. Every Stage-1 contract is still a searchable record
          # with its contract-level fields and paid_to_date, so a thin dated pull
          # never justifies skipping the write (the old skip-on-thin path is what
          # left data/contract-search.json missing and broke the commit step).
          if len(records) < 50 or contracts_with_dated_payments < 25:
              log("WARNING: dated pull looks thin "
                  "(contracts=%d, with_dated_payments=%d). Writing the file "
                  "anyway; every contract remains searchable with its contract-level fields."
                  % (len(records), contracts_with_dated_payments))

          with open("data/contract-search.json", "w") as f:
              f.write(payload)
          log("Wrote data/contract-search.json (%d bytes, %d contracts)"
              % (os.path.getsize("data/contract-search.json"), len(records)))
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "concrete-index-payments"
          git config user.email "actions@users.noreply.github.com"
          # Stage everything under data/ so a never-before-committed file does not
          # trip `pathspec did not match any files` (the old single-pathspec bug).
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes today"
          else
            git commit -m "Checkbook dated payments $(date -u +%Y-%m-%d)"
            # Rebase onto the latest main before pushing so a concurrent nightly
            # push cannot cause a non-fast-forward rejection (exit 128).
            git pull --rebase origin main
            git push
          fi
