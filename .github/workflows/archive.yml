name: Nightly data archive

# Snapshots the public datasets behind The Concrete Index into the repo.
# Git history of these files becomes a daily archive nobody else has:
# award-notice revisions, plan-to-plan changes, and a foundation for
# payment-speed and cohort analyses.

on:
  schedule:
    - cron: '15 6 * * *'   # 06:15 UTC daily (~1:15am New York)
  workflow_dispatch:

permissions:
  contents: write

# Four nightly jobs (archive, checkbook, payments, doing-business) all push to
# main on overlapping crons and GitHub's scheduler drifts them into each other.
# One shared concurrency group makes them QUEUE instead of collide. cancel-in-
# progress is false: every one of these runs must finish, none may be dropped.
concurrency:
  group: main-data-push
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # D4 (methodology alignment, 2026-11-20): every capped pull below is paged on
      # $order=:id and its row count is checked against a server-side count(*)
      # under the same $where (tools/socrata-pull.js). A short pull, a count over
      # the cap, or an HTTP failure exits non-zero BEFORE the file is replaced, so
      # the job stops, nothing is committed, and the repo keeps last night's file.
      # The previous single-request pulls could truncate silently at their $limit
      # (solicitations.json sat at exactly its 5,000-row limit).
      - name: Snapshot construction awards (full set, compact fields)
        run: |
          mkdir -p data
          node tools/socrata-pull.js --dataset qyyg-4tf5 \
            --select "pin,request_id,start_date,due_date,agency_name,category_description,selection_method_description,short_title,vendor_name,contract_amount" \
            --where "starts_with(category_description,'Construction')" \
            --cap 50000 --min 5000 --sort "start_date DESC,request_id" \
            --out data/awards.json

      - name: Snapshot construction solicitations (full set)
        run: |
          node tools/socrata-pull.js --dataset 3khw-qi8f \
            --select "request_id,start_date,agency_name,category_description,selection_method_description,short_title,pin,due_date,contact_name,email" \
            --where "starts_with(category_description,'Construction')" \
            --cap 30000 --min 1 --sort "due_date DESC,request_id" \
            --out data/solicitations.json

      - name: Snapshot latest capital plan period (compact fields)
        run: |
          PERIOD=$(curl -sf --retry 3 -G "https://data.cityofnewyork.us/resource/fb86-vt7u.json" \
            --data-urlencode "\$select=reporting_period" \
            --data-urlencode "\$group=reporting_period" \
            --data-urlencode "\$order=reporting_period DESC" \
            --data-urlencode "\$limit=1" | python3 -c "import sys,json;print(json.load(sys.stdin)[0]['reporting_period'])")
          echo "Latest plan period: $PERIOD"
          echo "PLAN_PERIOD=$PERIOD" >> "$GITHUB_ENV"
          node tools/socrata-pull.js --dataset fb86-vt7u \
            --select "fms_id,managing_agency,fms_project_name,total_budget,spend_to_date,current_phase,borough,ten_year_plan_category,budget_line" \
            --where "reporting_period='$PERIOD'" \
            --cap 20000 --min 3000 \
            --out data/plan-latest.json

      - name: Build construction-cost deflator from BLS (materials + labor)
        run: |
          # The browser cannot reach api.bls.gov (the site CSP locks connect-src to
          # the City and State open-data hosts), so the two national construction-cost
          # series are pulled here, server-side, and written to data/cost-index.json
          # for the pages to read same-origin. Materials = national PPI inputs to
          # construction industries, goods (WPUSI012011), because materials trade in
          # national markets; labor = NY State construction avg hourly earnings,
          # prod. & nonsup., NSA (SMU36000002000000008), the State-localized twin of
          # the prior national CES series. Each rebased to its 2019 average = 100,
          # blended 60/40, latest unpublished month(s) forward-filled. NY State
          # publishes one month behind national, so the latest month is forward-filled.
          # BLS v2 silently drops the middle of a >13-year request, so we chunk by
          # decade and merge. Keyless v2 is sufficient at this volume; a key is used
          # only if BLS_API_KEY is present in the environment.
          python3 - <<'PYEOF'
          import json, time, urllib.request
          from datetime import datetime, timezone

          SERIES = {"materials": "WPUSI012011", "labor": "SMU36000002000000008"}
          # 2019 averages are recomputed from the pulled data below; no anchor is hardcoded.
          NAMES = {"materials": "PPI inputs to construction industries, goods",
                   "labor": "NY State construction avg hourly earnings, prod. & nonsup. (NSA)"}
          W = {"materials": 0.60, "labor": 0.40}
          import os
          KEY = os.environ.get("BLS_API_KEY") or None

          this_year = datetime.now(timezone.utc).year
          # <=10-year chunks; a single >13-year request silently drops middle years.
          chunks, y = [], 2004
          while y <= this_year:
              chunks.append((y, min(y + 9, this_year)))
              y += 10

          def fetch_chunk(sy, ey):
              body = {"seriesid": list(SERIES.values()), "startyear": str(sy), "endyear": str(ey)}
              if KEY:
                  body["registrationkey"] = KEY
              req = urllib.request.Request(
                  "https://api.bls.gov/publicAPI/v2/timeseries/data/",
                  data=json.dumps(body).encode("utf-8"),
                  headers={"Content-Type": "application/json"})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=60) as r:
                          j = json.loads(r.read().decode("utf-8"))
                      if j.get("status") != "REQUEST_SUCCEEDED":
                          raise RuntimeError("BLS status %s %s" % (j.get("status"), j.get("message")))
                      return j
                  except Exception as e:
                      if attempt == 3:
                          raise
                      time.sleep(3 * (attempt + 1))

          raw = {sid: {} for sid in SERIES.values()}
          for sy, ey in chunks:
              j = fetch_chunk(sy, ey)
              for s in j.get("Results", {}).get("series", []):
                  sid = s["seriesID"]
                  for d in s.get("data", []):
                      p = d.get("period", "")
                      if not p.startswith("M") or p == "M13":
                          continue
                      raw[sid]["%s-%s" % (d["year"], p[1:])] = float(d["value"])

          mat_id, lab_id = SERIES["materials"], SERIES["labor"]
          assert len(raw[mat_id]) > 200 and len(raw[lab_id]) > 200, "BLS returned too few months"

          def avg2019(series):
              vals = [v for k, v in series.items() if k.startswith("2019")]
              return sum(vals) / len(vals)
          mat_avg, lab_avg = avg2019(raw[mat_id]), avg2019(raw[lab_id])

          # continuous month list from the earliest common start to the latest published
          allk = sorted(set(raw[mat_id]) | set(raw[lab_id]))
          start, end = allk[0], allk[-1]
          def month_iter(a, b):
              y, mo = map(int, a.split("-")); ey, emo = map(int, b.split("-"))
              while (y, mo) <= (ey, emo):
                  yield "%04d-%02d" % (y, mo)
                  mo += 1
                  if mo > 12: mo = 1; y += 1
          months = list(month_iter(start, end))

          series, last_mat, last_lab = [], None, None
          for mo in months:
              mr = raw[mat_id].get(mo); lr = raw[lab_id].get(mo); ff = False
              if mr is None: mr = last_mat; ff = True
              else: last_mat = mr
              if lr is None: lr = last_lab; ff = True
              else: last_lab = lr
              if mr is None or lr is None:
                  continue
              mat_i = 100.0 * mr / mat_avg
              lab_i = 100.0 * lr / lab_avg
              deflator = W["materials"] * mat_i + W["labor"] * lab_i
              series.append({"month": mo, "materials": round(mat_i, 2), "labor": round(lab_i, 2),
                             "deflator": round(deflator, 2), "ff": ff})

          out = {
              "as_of": time.strftime("%Y-%m-%d", time.gmtime()),
              "base_year": 2019,
              "weights": {"materials": W["materials"], "labor": W["labor"]},
              "sources": {
                  "materials": {"id": mat_id, "name": NAMES["materials"], "avg2019": round(mat_avg, 3)},
                  "labor": {"id": lab_id, "name": NAMES["labor"], "avg2019": round(lab_avg, 3)}},
              "series": series,
          }
          json.dump(out, open("data/cost-index.json", "w"), separators=(",", ":"))
          print("cost-index: %d months %s..%s; matAvg=%.3f labAvg=%.3f; latest deflator=%.2f ff=%s"
                % (len(series), series[0]["month"], series[-1]["month"], mat_avg, lab_avg,
                   series[-1]["deflator"], series[-1]["ff"]))
          PYEOF

      - name: Precompute home headline aggregates (resilience fallback)
        run: |
          # Small aggregate the home page reads ONLY when the live City API is
          # unreachable, so the hero shows last-good figures instead of an error.
          # Computed with the SAME window and the SAME pin-dedup rule the page
          # uses, so the fallback number reconciles with the live one. Reads the
          # awards.json just pulled.
          python3 - <<'PYEOF'
          import json, time, statistics, os
          from datetime import datetime, timezone
          rows = json.load(open('data/awards.json'))

          # CANONICAL TRAILING TWELVE MONTHS (site-wide): twelve FULLY-ELAPSED
          # months. month_boundary(0) is the first day of the current, incomplete
          # month, so the window [month_boundary(12), month_boundary(0)) never
          # reads the partial month in progress. This is the Python twin of the
          # completeMonthStart()/isoBoundary() helper the home, competitive,
          # agency, funnel, analysis and briefing pages use. It replaced a rolling
          # 365-day cutoff, which made this fallback disagree with every live page.
          _now = datetime.now(timezone.utc)
          def month_boundary(n):
              y, mo = _now.year, _now.month - n
              while mo <= 0:
                  mo += 12
                  y -= 1
              return '%04d-%02d-01' % (y, mo)
          TTM_LO, TTM_HI = month_boundary(12), month_boundary(0)   # [lo, hi)

          # Window FIRST, then dedupe to one row per pin at max contract_amount --
          # the exact order the live page uses (it filters the window in SoQL and
          # dedupes what comes back). Deduping first and filtering after would let
          # an out-of-window notice win a pin and drop an in-window award.
          byPin = {}
          for i, r in enumerate(rows):
              d = (r.get('start_date') or '')[:10]
              if not d or not (TTM_LO <= d < TTM_HI):
                  continue
              try: amt = float(r.get('contract_amount') or 0)
              except (TypeError, ValueError): amt = 0.0
              if not (amt > 0):
                  continue
              # unpinned notices stand alone, same as the page's '_np_' fallback
              pin = r.get('pin') or r.get('request_id') or ('_np_%d' % i)
              prev = byPin.get(pin)
              if prev is None or amt > prev:
                  byPin[pin] = amt
          amts = list(byPin.values())
          total = int(round(sum(amts))); count = len(amts)
          median = int(round(statistics.median(amts))) if amts else 0
          mx = int(round(max(amts))) if amts else 0
          # --- The Concrete Index level (same method as the Analysis page) ---
          import re, math
          MEGA = 500e6
          def _is_cont(x): return bool(re.search(r'renewal|extension', x or '', re.I))
          ipin = {}
          for r in rows:
              try: amt = float(r.get('contract_amount') or 0)
              except (TypeError, ValueError): amt = 0.0
              if not (amt > 0) or amt >= MEGA: continue
              pin = r.get('pin') or r.get('request_id')
              prev = ipin.get(pin)
              if prev is None or amt > prev[0]:
                  ipin[pin] = (amt, (r.get('start_date') or '')[:7], _is_cont(r.get('selection_method_description')))
          bymonth = {}
          for amt, mo, cont in ipin.values():
              if cont or not mo: continue
              e = bymonth.get(mo) or [0.0, 0]
              e[0] += amt; e[1] += 1; bymonth[mo] = e
          nowdt = datetime.now(timezone.utc)
          y, mo = 2003, 1
          months = []
          while (y, mo) < (nowdt.year, nowdt.month):
              months.append('%04d-%02d' % (y, mo))
              mo += 1
              if mo > 12: mo = 1; y += 1
          vv = [ (bymonth.get(m) or [0.0,0])[0] for m in months ]
          cc = [ (bymonth.get(m) or [0.0,0])[1] for m in months ]
          tM=[]; tV=[]; tC=[]; sv=0.0; sc=0
          for i in range(len(months)):
              sv += vv[i]; sc += cc[i]
              if i>=12: sv -= vv[i-12]; sc -= cc[i-12]
              if i>=11: tM.append(months[i]); tV.append(sv); tC.append(sc)
          bi = [i for i,m in enumerate(tM) if m.startswith('2019')]
          baseV = (sum(tV[i] for i in bi)/len(bi)) if bi else (tV[0] if tV else 0)
          baseC = (sum(tC[i] for i in bi)/len(bi)) if bi else (tC[0] if tC else 0)
          index_level = None; index_month = None
          if tM and baseV>0 and baseC>0 and tV[-1]>0 and tC[-1]>0:
              index_level = round(100*math.sqrt((tV[-1]/baseV)*(tC[-1]/baseC)), 2)
              index_month = tM[-1]
          # --- Cost-adjusted Concrete Index level (same deflation as the Analysis page) ---
          # Deflate each award month's value by THAT month's deflator (from the
          # cost-index.json the prior step just wrote), sum to trailing-twelve real
          # value, then apply the same geometric blend with the unchanged count.
          adjusted_index_level = None; adjusted_index_month = None
          try:
              cost = json.load(open('data/cost-index.json'))
              defl = {}
              for s in cost.get('series', []):
                  if s.get('month') is not None and s.get('deflator') is not None:
                      defl[s['month']] = float(s['deflator'])
              if defl:
                  first_defl = float(cost['series'][0]['deflator'])
                  last_defl_month = cost['series'][-1]['month']
                  last_defl = float(cost['series'][-1]['deflator'])
                  rv = []
                  for i, m in enumerate(months):
                      # forward-fill the latest deflator for award months past the
                      # last published cost month (BLS posts a month or two behind);
                      # months before the series begins fall back to the earliest.
                      if m in defl:
                          d = defl[m]
                      else:
                          d = last_defl if m > last_defl_month else first_defl
                      rv.append(vv[i] / (d/100.0) if d > 0 else vv[i])
                  tRV = []; sr = 0.0
                  for i in range(len(months)):
                      sr += rv[i]
                      if i >= 12: sr -= rv[i-12]
                      if i >= 11: tRV.append(sr)
                  baseRV = (sum(tRV[i] for i in bi)/len(bi)) if bi else (tRV[0] if tRV else 0)
                  if tM and baseRV > 0 and baseC > 0 and tRV[-1] > 0 and tC[-1] > 0:
                      adjusted_index_level = round(100*math.sqrt((tRV[-1]/baseRV)*(tC[-1]/baseC)), 2)
                      adjusted_index_month = tM[-1]
          except Exception:
              adjusted_index_level = None; adjusted_index_month = None
          # --- Glimpse numbers for the landing page ---
          PHASE_MAP = {'pending':'Pending','initiation':'Pending','pre-design':'Pre-Design','predesign':'Pre-Design','design':'Design','construction procurement':'Procurement','construction':'Construction','design build':'Construction','design built':'Construction','close-out':'Close-out','closeout':'Close-out'}
          # Canonical phase exclusion set, identical to lib/plan-core.js EXCLUDED_LIST
          # (test/methodology.test.js asserts the two match).
          EXCLUDED = set(['completed','cancelled','inactive','on-hold','on hold','transferred','withdrawn','terminated','defaulted','capitally ineligible','expense','defunded','funding withdrawn','rescinded','fmsid changed','project renamed','n/a','land acquisition','property acquisition','land purchase','real estate transaction','fundraising','it project','non capital fund','equipment','consultant services'])
          ORDER = ['Pending','Pre-Design','Design','Procurement','Construction','Close-out','Other active']
          def _np(raw):
              q = (raw or '').replace('(','').replace(')','').strip().lower()
              if q in EXCLUDED: return 'excluded'
              return PHASE_MAP.get(q, 'Other active')
          # Matches the Pipeline page's _rank: 'Other active' is a catch-all for phases
          # the map doesn't know, not a stage of the sequence, so it ranks below every
          # real phase (-1). Otherwise a project emitting both an unmapped phase and a
          # real one would collapse to the catch-all and lose the real phase.
          def _rank(b):
              if b == 'Other active': return -1
              return ORDER.index(b) if b in ORDER else -1
          committed = None
          try:
              plan = json.load(open('data/plan-latest.json'))
              coll = {}
              for i, r in enumerate(plan):
                  bucket = _np(r.get('current_phase'))
                  if bucket == 'excluded': continue
                  # D3 (aligned 2026-11-20): a missing fms_id falls back to the
                  # project name, the rule the plan pages and lib/plan-core.js use,
                  # in place of a per-row surrogate. Agency blank keys as ''.
                  fmsId = r.get('fms_id') or r.get('fms_project_name') or ''
                  key = (r.get('managing_agency') or '') + '|' + fmsId
                  try: bud = max(float(r.get('total_budget') or 0), 0.0)
                  except (TypeError, ValueError): bud = 0.0
                  try: spd = max(float(r.get('spend_to_date') or 0), 0.0)
                  except (TypeError, ValueError): spd = 0.0
                  prev = coll.get(key)
                  if prev is None or _rank(bucket) > _rank(prev[2]):
                      coll[key] = (bud, spd, bucket)
              # headline matches the Pipeline page: collapse to one record per project,
              # keep the most advanced phase, exclude Close-out from the unspent total.
              committed = int(round(sum(max(b - sp, 0.0) for b, sp, bk in coll.values() if bk != 'Close-out')))
          except Exception:
              committed = None
          open_sol = None
          try:
              sols = json.load(open('data/solicitations.json'))
              now = datetime.now(timezone.utc)
              today = now.strftime('%Y-%m-%d')
              # Mirror the Bidding page's working-list rule exactly, so the landing-page
              # count equals the number the Bidding page shows rather than running a few
              # higher. The page: (1) reads notices due today or later, (2) dedupes by
              # pin (else request_id, first by due date), (3) drops "dead" one-time bids
              # whose only deadline is a far-future placeholder (>5 yrs out) and that
              # were posted over a year ago. Standing pre-qualified lists (an RFQ/PQL
              # method carrying a placeholder) are real open opportunities and are kept.
              PQL = re.compile(r'request for qualifications|pre-?qualified list', re.I)
              # Parse the FULL timestamp (not just the date), matching the Bidding
              # page's new Date(...), and compare in seconds against the same
              # millisecond horizons the page uses, so the two counts agree to the
              # notice rather than differing by up to a day at a rule boundary.
              def _dt(s):
                  s = (s or '').strip().replace('Z', '+00:00')
                  if not s: return None
                  try: dt = datetime.fromisoformat(s)
                  except Exception:
                      try: dt = datetime.strptime(s[:10], '%Y-%m-%d')
                      except Exception: return None
                  if dt.tzinfo is None: dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc)
              SENTINEL_S = 5 * 365.25 * 86400   # page: 5 * 365.25 days, in seconds
              STALE_S = 365 * 86400             # page: 365 days, in seconds
              seen = set(); cnt = 0
              # sort by due date so dedupe keeps the earliest-due record, as the page does
              for sdoc in sorted(sols, key=lambda s: (s.get('due_date') or '')):
                  d = (sdoc.get('due_date') or '')[:10]
                  if not d or d < today: continue
                  k = sdoc.get('pin') or sdoc.get('request_id')
                  if k in seen: continue
                  seen.add(k)
                  due = _dt(sdoc.get('due_date'))
                  posted = _dt(sdoc.get('start_date'))
                  method = sdoc.get('selection_method_description') or ''
                  is_sentinel = due is not None and (due - now).total_seconds() > SENTINEL_S
                  is_standing = is_sentinel and bool(PQL.search(method))
                  is_dead = (is_sentinel and not is_standing and posted is not None
                             and (now - posted).total_seconds() > STALE_S)
                  if is_dead: continue
                  cnt += 1
              open_sol = cnt
          except Exception:
              open_sol = None
          try:
              contractors = len(set((r.get('vendor_name') or '').strip().upper() for r in rows if (r.get('vendor_name') or '').strip()))
          except Exception:
              contractors = None
          out = {"meta": {"generated": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                          "source": "archived awards.json (NYC City Record qyyg-4tf5), pin-deduped",
                          "window": ("twelve fully-elapsed months [%s, %s), all construction; "
                                     "the same canonical trailing-twelve window the pages compute live"
                                     % (TTM_LO, TTM_HI)),
                          "ttm_start": TTM_LO, "ttm_end": TTM_HI,
                          "committed_period": os.environ.get("PLAN_PERIOD") or None},
                 "awarded_ttm": {"total": total, "count": count, "median": median, "max": mx},
                 "index_level": index_level, "index_month": index_month,
                 "adjusted_index_level": adjusted_index_level, "adjusted_index_month": adjusted_index_month,
                 "glimpse": {"committed": committed, "awarded": total, "open_solicitations": open_sol, "contractors": contractors}}
          json.dump(out, open('data/precomputed.json', 'w'), separators=(",", ":"))
          print("precomputed awarded_ttm: total=%d count=%d median=%d max=%d" % (total, count, median, mx))
          print("precomputed index_level=%s month=%s adjusted=%s committed=%s open_sol=%s contractors=%s" % (index_level, index_month, adjusted_index_level, committed, open_sol, contractors))
          PYEOF

      - name: Add the index comparison points to precomputed.json (lib/award-core.js)
        run: |
          # Home's "vs <prior month>" chip, its counter, and the "Index vs a year
          # ago" tile read index_prior_* and index_year_ago_* from here instead of
          # pulling the full award history (about 1.3 MB) on every visit. Same
          # series as the Analysis page, computed from the awards.json pulled
          # above at the precompute's own instant; written as null (and Home reads
          # live) unless the series ends on the published index_level and month.
          node tools/build-index-points.js --data data

      - name: Build plan-history.json (every plan period, paged, lib/plan-core.js rules)
        id: planhistory
        continue-on-error: true
        run: |
          node tools/build-plan-history.js --out data/plan-history.json.new
          # One definition of Committed: the history's latest period must reproduce
          # the precomputed headline to the dollar, on the same period. If it does
          # not, the new file is discarded and yesterday's stays.
          node -e '
            const fs=require("fs"), rd=f=>JSON.parse(fs.readFileSync(f,"utf8"));
            const h=rd("data/plan-history.json.new"), p=rd("data/precomputed.json");
            const l=h.periods[h.periods.length-1];
            const a=Math.round(l.committed.total), b=p.glimpse.committed, per=process.env.PLAN_PERIOD;
            console.log("plan-history latest", l.period, a, "precomputed", per, b);
            if(a!==b || l.period!==per){ console.error("plan-history disagrees with precomputed.json; keeping the previous file"); process.exit(1); }'
          mv data/plan-history.json.new data/plan-history.json

      - name: Discard a failed plan-history build
        if: steps.planhistory.outcome == 'failure'
        run: |
          rm -f data/plan-history.json.new data/*.tmp-*
          echo "::warning::plan-history.json not refreshed tonight; the committed copy keeps its own generated_at"

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "concrete-index-archive"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes today"
            exit 0
          fi
          git commit -m "Data archive $(date -u +%Y-%m-%d)"
          # This job checks out main and then spends minutes on the City and BLS
          # APIs. A sibling nightly job can land on main in that window, so a bare
          # `git push` is not a fast-forward and is rejected. Rebase onto the
          # latest main before pushing, and retry, because a racing job can land
          # again between our fetch and our push. Only a rebase CONFLICT (a real
          # problem) fails the job. The shared concurrency group above should keep
          # these serialized; this is the belt to that suspenders.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || {
              echo "Rebase onto origin/main failed (conflict) on attempt $attempt"
              git rebase --abort || true
              exit 1
            }
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt (main moved again); retrying"
            sleep $((attempt * 10))
          done
          echo "Could not push after 5 rebase+push attempts"
          exit 1
