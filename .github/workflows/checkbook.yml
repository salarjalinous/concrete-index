name: Checkbook NYC vendor data

# Pulls registered (Contracts) and paid-to-date (Spending) per construction
# vendor from the Checkbook NYC API and writes data/checkbook-vendors.json,
# keyed on the SAME normName() the /vendors/ page uses so the page can join.
# Stdlib-only Python (urllib + xml), no extra deps. Commits only if changed.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '45 7 * * *'   # 07:45 UTC daily (02:45 EST / 03:45 EDT), 90 min after the archive job.
                           # The four data jobs share one concurrency group, so a short nominal
                           # gap does not buy a short real-time gap: a queued job starts the
                           # instant the one ahead of it finishes. When two pushes land seconds
                           # apart, GitHub Pages cancels the older build and the earlier commit
                           # shows a red check even though its workflow was green. 90 minutes
                           # gives each job room to finish and its Pages build to complete.

permissions:
  contents: write

# Four nightly jobs (archive, checkbook, payments, doing-business) all push to
# main on overlapping crons and GitHub's scheduler drifts them into each other:
# this job died on a non-fast-forward push 12 nights running. One shared
# concurrency group makes them QUEUE instead of collide. cancel-in-progress is
# false: every one of these runs must finish, none may be dropped. The rebase-
# and-retry in the commit step below stays as the second line of defence.
concurrency:
  group: main-data-push
  cancel-in-progress: false

jobs:
  checkbook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build checkbook-vendors.json
        run: |
          mkdir -p data
          python3 - <<'PYEOF'
          import json, sys, time, re, os
          import urllib.request, urllib.error
          import xml.etree.ElementTree as ET

          API = "https://www.checkbooknyc.com/api"
          FYS = [2021, 2022, 2023, 2024, 2025]
          MAX_RECORDS = 1000
          CONSTR_RE = re.compile(r"constr|engineer|architect|paving|excavat|infrastructure", re.I)

          # ---- normalizer: byte-for-byte equivalent of the /vendors/ page normName() ----
          # JS: (s||'').trim().replace(/\s+/g,' ').toUpperCase().replace(/[.,;:&/\\'"`\-\s]+$/,'').trim()
          _TRAIL = re.compile(r"[.,;:&/\\'\"`\-\s]+$")
          def norm_name(s):
              if s is None:
                  s = ""
              s = s.strip()
              s = re.sub(r"\s+", " ", s)
              s = s.upper()
              s = _TRAIL.sub("", s)
              return s.strip()

          def log(*a):
              print(*a, flush=True)

          def build_request_xml(type_of_data, columns, criteria, records_from):
              crit_xml = ""
              for nm, ty, val in criteria:
                  crit_xml += ("<criteria><name>%s</name><type>%s</type><value>%s</value></criteria>"
                               % (nm, ty, val))
              cols_xml = "".join("<column><name>%s</name></column>" % c for c in columns)
              return ('<?xml version="1.0"?>'
                      "<request>"
                      "<type_of_data>%s</type_of_data>"
                      "<records_from>%d</records_from>"
                      "<max_records>%d</max_records>"
                      "<search_criteria>%s</search_criteria>"
                      "<response_columns>%s</response_columns>"
                      "</request>") % (type_of_data, records_from, MAX_RECORDS, crit_xml, cols_xml)

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36 "
                "ConcreteIndex/1.0 (+https://concreteindex.co)")

          def post(xml_body, tries=6):
              last = None
              for attempt in range(tries):
                  try:
                      req = urllib.request.Request(
                          API, data=xml_body.encode("utf-8"),
                          headers={"Content-Type": "text/xml", "Accept": "text/xml",
                                   "User-Agent": UA},
                          method="POST")
                      with urllib.request.urlopen(req, timeout=120) as r:
                          return r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      last = e
                      log("  POST attempt %d failed: HTTP %s" % (attempt + 1, e.code))
                      # 403/429 = rate-limited: exponential backoff, generous.
                      if e.code in (403, 429):
                          time.sleep(min(60, 8 * (2 ** attempt)))
                      else:
                          time.sleep(3 * (attempt + 1))
                  except Exception as e:
                      last = e
                      log("  POST attempt %d failed: %s" % (attempt + 1, e))
                      time.sleep(3 * (attempt + 1))
              raise RuntimeError("POST failed after %d tries: %s" % (tries, last))

          def parse_records(xml_text):
              # Returns (recs, raw). recs is None on hard error (parse fail or API
              # <result>failure</result>); [] on a clean empty page.
              try:
                  root = ET.fromstring(xml_text)
              except ET.ParseError as e:
                  log("  XML parse error:", e)
                  log("  first 600 chars:", xml_text[:600])
                  return None, xml_text
              # API-level failure: dump every <message> so we can read the contract.
              result = None
              for el in root.iter():
                  if el.tag.lower() == "result":
                      result = (el.text or "").strip().lower()
                      break
              if result == "failure":
                  msgs = []
                  for m in root.iter():
                      if m.tag.lower() == "description":
                          msgs.append((m.text or "").strip())
                  log("  API returned failure. messages:")
                  for m in msgs:
                      log("    -", m)
                  return None, xml_text
              # log the API's own record_count when present (viewer-safe).
              for el in root.iter():
                  if el.tag.lower() == "record_count":
                      log("  [api record_count = %s]" % ((el.text or "").strip()))
                      break
              # Locate <result_records> and treat its repeated leaf-bearing child
              # elements as rows. Structure-agnostic: rows may be <record>,
              # <contract>, <transaction>, etc. (runs 4-6: record_count was in the
              # thousands but the old endswith('record') heuristic matched 0).
              container = None
              for el in root.iter():
                  if el.tag.lower() == "result_records":
                      container = el
                      break
              recs = []
              if container is not None:
                  # Each direct child of result_records is usually a wrapper whose
                  # children are the row elements; but sometimes the rows are the
                  # direct children. Walk one or two levels and pick elements whose
                  # OWN children are all leaves (text fields) -> that's a row.
                  def is_row(e):
                      kids = list(e)
                      return len(kids) > 0 and all(len(list(k)) == 0 for k in kids)
                  candidates = []
                  for child in container:
                      if is_row(child):
                          candidates.append(child)
                      else:
                          for gc in child:
                              if is_row(gc):
                                  candidates.append(gc)
                  for rec in candidates:
                      d = {}
                      for c in rec:
                          d[c.tag.lower()] = (c.text or "").strip()
                      if d:
                          recs.append(d)
              return recs, xml_text

          def fetch_all(type_of_data, columns, base_criteria, fy, industry_server):
              rows = []
              raw_first = None
              rf = 1
              page = 0
              while True:
                  crit = list(base_criteria)
                  if fy is not None:
                      crit.append(("fiscal_year", "value", str(fy)))
                  if industry_server:
                      crit.append(("industry", "value", "Construction"))
                  xml = build_request_xml(type_of_data, columns, crit, rf)
                  resp = post(xml)
                  recs, raw = parse_records(resp)
                  if page == 0:
                      raw_first = raw
                  if recs is None:
                      time.sleep(0.7)   # pace even on a short-circuit failure
                      return rows, raw_first
                  rows.extend(recs)
                  got = len(recs)
                  page += 1
                  if got < MAX_RECORDS:
                      break
                  rf += MAX_RECORDS
                  time.sleep(1.0)   # pace paging to avoid 403 rate-limit
                  if rf > 300000:
                      log("  WARNING paging cap hit for", type_of_data, fy)
                      break
              time.sleep(0.7)       # pace between (domain, fy) combinations
              return rows, raw_first

          def to_int_amount(s):
              if not s:
                  return 0
              s = s.replace(",", "").replace("$", "").strip()
              try:
                  return int(round(float(s)))
              except ValueError:
                  return 0

          def load_aliases(path):
              with open(path) as f:
                  raw = json.load(f)
              v2p = {}
              for g in raw:
                  for v in g.get("variants", []):
                      nv = norm_name(v)
                      if nv:
                          v2p[nv] = g["parent"]
              return v2p

          alias_path = "site/data/vendor-aliases.json"
          if not os.path.exists(alias_path):
              alias_path = "data/vendor-aliases.json"
          variant_to_parent = load_aliases(alias_path)
          log("Loaded %d normalized variant keys from %s" % (len(variant_to_parent), alias_path))

          # Real API column + criterion names, locked from run #3's failure
          # messages (the doc-based names in the spec were wrong; the live API
          # returned its own valid lists):
          #   Contracts domain = "Registered Contracts(expense)", columns are
          #   prime_contract_* prefixed; there is NO returnable fiscal_year column
          #   (fiscal_year works only as a SEARCH criterion), so the output fiscal
          #   year is derived from prime_contract_registration_date.
          #   Spending domain returns 3.2M+ checks per FY (whole-city) and cannot
          #   be paged in an Action, AND it has no usable contract/construction
          #   server filter we can express. So PAID is taken from the Contracts
          #   pull itself via prime_vendor_spent_to_date (a valid Contracts column),
          #   which is paid-to-date against the registered contract. This keeps
          #   registered (prime_contract_current_amount) and paid
          #   (prime_vendor_spent_to_date) separate and both sourced from the same
          #   bounded ~18k-row registered-contracts set.
          contracts_cols = ["prime_vendor", "prime_contract_id", "prime_contracting_agency",
                            "prime_contract_industry", "prime_contract_current_amount",
                            "prime_vendor_spent_to_date",
                            "prime_contract_original_amount", "prime_contract_purpose",
                            "prime_contract_registration_date"]

          # category=expense + status=registered are both accepted on Contracts
          # (status valid values are 'pending,registered').
          CONTRACTS_BASE = [("category", "value", "expense"),
                            ("status", "value", "registered")]

          # Logical-field accessors map real API column names -> the names the
          # aggregation uses.
          def c_name(r):    return r.get("prime_vendor", "")
          def c_cid(r):     return r.get("prime_contract_id", "") or ""
          def c_agency(r):  return r.get("prime_contracting_agency", "")
          def c_industry(r):return r.get("prime_contract_industry", "") or ""
          def c_amount(r):  return r.get("prime_contract_current_amount", "")
          def c_paid(r):    return r.get("prime_vendor_spent_to_date", "")
          def c_fy(r):
              # fiscal year derived from registration date (YYYY-MM-DD...).
              d = r.get("prime_contract_registration_date", "") or ""
              m = re.match(r"(\d{4})", d)
              return m.group(1) if m else ""

          # Run 6 cracked it: criteria category=expense + status=registered +
          # fiscal_year are correct (record_count was 17,872 for Contracts FY2024,
          # millions for Spending) but the OLD parser matched 0 rows because the
          # row element is not literally <record>. parse_records now reads the
          # <result_records> container structure-agnostically. Industry server-side
          # needs a 2-char CODE we do not have, so we always client-filter on the
          # returned industry text.
          industry_mode = "client"
          server = False
          contracts_use_fy = True

          # Confirmation probe: one page, dump first parsed record to verify the
          # parser fix and field names (incl. prime_vendor_spent_to_date).
          log("=== PROBE: Contracts FY%d (confirm parser) ===" % FYS[-1])
          cprobe, _ = fetch_all("Contracts", contracts_cols, CONTRACTS_BASE, FYS[-1], industry_server=False)
          log("  parsed %d contract rows" % len(cprobe))
          if cprobe:
              log("  FIRST Contracts record:")
              for k, v in list(cprobe[0].items()):
                  log("    %s = %r" % (k, v[:90] if isinstance(v, str) else v))

          all_contracts = []
          for fy in FYS:
              log("--- Contracts FY%d ---" % fy)
              rows, _ = fetch_all("Contracts", contracts_cols, CONTRACTS_BASE, fy, industry_server=server)
              log("  %d contract rows" % len(rows))
              all_contracts.extend(rows)

          def keep_c(r):
              return True if server else bool(CONSTR_RE.search(c_industry(r)))

          # Distinct industry breakdown of the FULL pull, split by whether the
          # construction filter keeps it. Written to a committed side file so the
          # exact industry vocabulary is lockable from validated output (the spec
          # requires dumping distinct industry values to lock the set).
          industries_kept, industries_dropped = {}, {}
          for r in all_contracts:
              ind = c_industry(r)
              if not ind:
                  ind = "(blank)"
              if CONSTR_RE.search(ind):
                  industries_kept[ind] = industries_kept.get(ind, 0) + 1
              else:
                  industries_dropped[ind] = industries_dropped.get(ind, 0) + 1
          log("=== DISTINCT industry values KEPT (count -> value) ===")
          for k in sorted(industries_kept, key=lambda x: -industries_kept[x]):
              log("  %8d  %s" % (industries_kept[k], k))
          log("=== DISTINCT industry values DROPPED (top 40 by count) ===")
          for k in sorted(industries_dropped, key=lambda x: -industries_dropped[x])[:40]:
              log("  %8d  %s" % (industries_dropped[k], k))
          with open("data/checkbook-industries.json", "w") as f:
              json.dump({"kept": industries_kept, "dropped": industries_dropped}, f,
                        separators=(",", ":"), ensure_ascii=False)

          contracts = [r for r in all_contracts if keep_c(r)]
          log("After construction filter: contracts=%d (mode=%s)"
              % (len(contracts), industry_mode))

          def resolve(name):
              k = norm_name(name)
              parent = variant_to_parent.get(k)
              if parent:
                  return parent, True
              return (name or "").strip(), False

          groups = {}
          def group_for(label, matched):
              g = groups.get(label)
              if g is None:
                  g = {"label": label, "matched": matched, "registered": 0, "paid": 0,
                       "agencies": set(), "fy_first": None, "fy_last": None, "_cm": {}}
                  groups[label] = g
              return g
          def upd_fy(g, fy):
              try:
                  fyi = int(str(fy)[:4])
              except (ValueError, TypeError):
                  return
              if g["fy_first"] is None or fyi < g["fy_first"]:
                  g["fy_first"] = fyi
              if g["fy_last"] is None or fyi > g["fy_last"]:
                  g["fy_last"] = fyi

          for r in contracts:
              name = c_name(r)
              if not name:
                  continue
              label, matched = resolve(name)
              g = group_for(label, matched)
              if matched:
                  g["matched"] = True
              cid = c_cid(r)
              amt = to_int_amount(c_amount(r))     # registered (current amount)
              paid = to_int_amount(c_paid(r))      # paid-to-date (spent to date)
              fy = c_fy(r)
              try:
                  fyi = int(fy[:4]) if fy else 0
              except (ValueError, TypeError):
                  fyi = 0
              ag = c_agency(r)
              if ag:
                  g["agencies"].add(ag)
              upd_fy(g, fy)
              # Dedupe by contract_id keeping max fiscal_year then max amount; the
              # paid figure travels with the winning contract row so registered and
              # paid stay reconciled per contract and never double-count.
              if cid:
                  prev = g["_cm"].get(cid)
                  if prev is None or (fyi, amt) > (prev[0], prev[1]):
                      g["_cm"][cid] = (fyi, amt, paid)
              else:
                  g["_cm"]["__nocid_%d_%d" % (len(g["_cm"]), amt)] = (fyi, amt, paid)

          for g in groups.values():
              g["registered"] = sum(v[1] for v in g["_cm"].values())
              g["paid"] = sum(v[2] for v in g["_cm"].values())

          vendors = {}
          total_registered = total_paid = 0
          for label, g in groups.items():
              key = norm_name(label)
              if not key:
                  continue
              rec = {"label": g["label"], "registered": int(g["registered"]), "paid": int(g["paid"]),
                     "agencies": len(g["agencies"]), "fy_first": g["fy_first"], "fy_last": g["fy_last"],
                     "matched": bool(g["matched"])}
              if key in vendors and vendors[key]["registered"] >= rec["registered"]:
                  continue
              vendors[key] = rec

          for rec in vendors.values():
              total_registered += rec["registered"]
              total_paid += rec["paid"]

          group_count = len(vendors)
          truncated = False
          raw_estimate = len(json.dumps({"vendors": vendors}))
          if group_count > 1500 or raw_estimate > 150 * 1024:
              items = sorted(vendors.items(), key=lambda kv: -kv[1]["registered"])[:300]
              vendors = dict(items)
              truncated = True

          # spending_rows = number of contract rows carrying a paid (spent-to-date)
          # figure, since paid is sourced from the Contracts pull, not a separate
          # Spending fetch (the Spending domain is 3.2M+ checks/FY, unpageable here).
          spending_rows = sum(1 for r in contracts if to_int_amount(c_paid(r)) > 0)
          now_iso = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
          meta = {"generated": now_iso,
                  "last_attempt": now_iso,
                  "last_attempt_status": "ok",
                  # Declared refresh contract, read by /funnel/ to decide when the
                  # Paid gauge is too old to publish. cadence_hours = how often the
                  # job is scheduled; stale_after_hours = the grace the page allows
                  # (two missed runs) before it discloses staleness on the figure;
                  # drop_after_hours = the hard floor past which the page must stop
                  # showing the figure entirely rather than power it from a stale
                  # file. Published in the data so page and pipeline can never
                  # define the cadence differently.
                  "cadence_hours": 24,
                  "stale_after_hours": 48,
                  "drop_after_hours": 336,
                  "source": "Checkbook NYC API (checkbooknyc.com), Registered Contracts (expense)",
                  "fiscal_years": FYS,
                  "industry_filter_mode": industry_mode, "contracts_rows": len(contracts),
                  "spending_rows": spending_rows, "groups": group_count,
                  "paid_source": "prime_vendor_spent_to_date on registered contracts"}
          if truncated:
              meta["truncated"] = True
          out = {"meta": meta, "vendors": vendors}

          log("=== SUMMARY ===")
          log("contracts_rows=%d spending_rows(paid>0)=%d groups=%d mode=%s"
              % (len(contracts), spending_rows, group_count, industry_mode))
          log("total registered = $%d  total paid = $%d" % (total_registered, total_paid))
          cruz_key = norm_name("E.E. Cruz / JRCruz")
          log("Cruz key = %r -> %s" % (cruz_key, json.dumps(vendors.get(cruz_key, "MISSING"))))
          tp_key = norm_name("Tutor Perini")
          log("Tutor Perini key = %r -> %s" % (tp_key, json.dumps(vendors.get(tp_key, "MISSING"))))

          # Quality gate. On a thin or partial pull, KEEP the last good VENDOR
          # NUMBERS and exit cleanly (exit 0) instead of failing the job: a
          # nightly data-refresh should not email the owner over a transient
          # upstream hiccup.
          #
          # But it must not fail SILENTLY either. The old path returned early and
          # left the file byte-identical, so a degraded pull was invisible to the
          # page and /funnel/ went on drawing "Paid" from data of unknown age. So
          # the degraded path now REWRITES the existing file in place, keeping the
          # last good vendors and the ORIGINAL `generated` stamp (the age of the
          # numbers is the age of the numbers) while stamping last_attempt /
          # last_attempt_status = "degraded" on the meta. The figure the page draws
          # is unchanged; the fact that it is aging is now on the record, and the
          # page's own staleness check keys off `generated`.
          ok = (len(contracts) > 0 and spending_rows > 0
                and group_count >= 50 and total_registered >= 1_000_000_000)
          if not ok:
              note = ("degraded pull: contracts=%d, paid_rows=%d, groups=%d, registered=$%d"
                      % (len(contracts), spending_rows, group_count, total_registered))
              log("WARNING: Checkbook pull looks partial or degraded (%s). "
                  "Keeping the last good vendor numbers and stamping the failed "
                  "attempt on the file's meta." % note)
              prev = None
              try:
                  with open("data/checkbook-vendors.json") as f:
                      prev = json.load(f)
              except Exception as e:
                  log("  no readable previous file (%s); nothing to preserve, exiting." % e)
                  sys.exit(0)
              pm = prev.get("meta") or {}
              pm["last_attempt"] = now_iso
              pm["last_attempt_status"] = "degraded"
              pm["last_attempt_note"] = note
              # Backfill the freshness contract onto files written before it existed.
              pm.setdefault("cadence_hours", 24)
              pm.setdefault("stale_after_hours", 48)
              pm.setdefault("drop_after_hours", 336)
              prev["meta"] = pm
              with open("data/checkbook-vendors.json", "w") as f:
                  json.dump(prev, f, separators=(",", ":"), ensure_ascii=False)
              log("Rewrote data/checkbook-vendors.json meta only: vendors and "
                  "generated=%r preserved, last_attempt=%s status=degraded"
                  % (pm.get("generated"), now_iso))
              sys.exit(0)

          with open("data/checkbook-vendors.json", "w") as f:
              json.dump(out, f, separators=(",", ":"), ensure_ascii=False)
          log("Wrote data/checkbook-vendors.json (%d bytes, %d vendors)"
              % (os.path.getsize("data/checkbook-vendors.json"), len(vendors)))
          PYEOF

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "concrete-index-checkbook"
          git config user.email "actions@users.noreply.github.com"
          # Stage everything under data/ so a never-before-committed file does not
          # trip `pathspec did not match any files` (the same bug payments.yml hit).
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes today"
            exit 0
          fi
          git commit -m "Checkbook vendor data $(date -u +%Y-%m-%d)"
          # THE FAILURE THIS FIXES: this job checks out main, then spends ~6 minutes
          # on the Checkbook API. The archive, doing-business and payments jobs push
          # to main on their own crons, and GitHub's scheduler drifts them into that
          # window, so by the time this job pushed, main had moved:
          #     ! [rejected]  main -> main (fetch first)
          #     error: failed to push some refs
          #     Error: Process completed with exit code 1
          # That is 12 of the last 13 runs (run #43: doing-business pushed at
          # 10:00:07Z, mid-run). The push is not a fast-forward, so it must rebase
          # onto the latest main first -- exactly what payments.yml already does.
          # Retried, because the racing job can land again between our fetch and our
          # push. Only a rebase CONFLICT (a real problem) fails the job.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || {
              echo "Rebase onto origin/main failed (conflict) on attempt $attempt"
              git rebase --abort || true
              exit 1
            }
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt (main moved again); retrying"
            sleep $((attempt * 10))
          done
          echo "Could not push after 5 rebase+push attempts"
          exit 1
