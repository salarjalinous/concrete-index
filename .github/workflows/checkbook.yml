name: Checkbook NYC vendor data

# Pulls registered (Contracts) and paid-to-date (Spending) per construction
# vendor from the Checkbook NYC API and writes data/checkbook-vendors.json,
# keyed on the SAME normName() the /vendors/ page uses so the page can join.
# Stdlib-only Python (urllib + xml), no extra deps. Commits only if changed.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '40 6 * * *'   # 06:40 UTC daily (~1:40am New York), after the archive job

permissions:
  contents: write

jobs:
  checkbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build checkbook-vendors.json
        run: |
          mkdir -p data
          python3 - <<'PYEOF'
          import json, sys, time, re, os
          import urllib.request, urllib.error
          import xml.etree.ElementTree as ET

          API = "https://www.checkbooknyc.com/api"
          FYS = [2021, 2022, 2023, 2024, 2025]
          MAX_RECORDS = 1000
          CONSTR_RE = re.compile(r"constr|engineer|architect|paving|excavat|infrastructure", re.I)

          # ---- normalizer: byte-for-byte equivalent of the /vendors/ page normName() ----
          # JS: (s||'').trim().replace(/\s+/g,' ').toUpperCase().replace(/[.,;:&/\\'"`\-\s]+$/,'').trim()
          _TRAIL = re.compile(r"[.,;:&/\\'\"`\-\s]+$")
          def norm_name(s):
              if s is None:
                  s = ""
              s = s.strip()
              s = re.sub(r"\s+", " ", s)
              s = s.upper()
              s = _TRAIL.sub("", s)
              return s.strip()

          def log(*a):
              print(*a, flush=True)

          def build_request_xml(type_of_data, columns, criteria, records_from):
              crit_xml = ""
              for nm, ty, val in criteria:
                  crit_xml += ("<criteria><name>%s</name><type>%s</type><value>%s</value></criteria>"
                               % (nm, ty, val))
              cols_xml = "".join("<column><name>%s</name></column>" % c for c in columns)
              return ('<?xml version="1.0"?>'
                      "<request>"
                      "<type_of_data>%s</type_of_data>"
                      "<records_from>%d</records_from>"
                      "<max_records>%d</max_records>"
                      "<search_criteria>%s</search_criteria>"
                      "<response_columns>%s</response_columns>"
                      "</request>") % (type_of_data, records_from, MAX_RECORDS, crit_xml, cols_xml)

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36 "
                "ConcreteIndex/1.0 (+https://concreteindex.co)")

          def post(xml_body, tries=6):
              last = None
              for attempt in range(tries):
                  try:
                      req = urllib.request.Request(
                          API, data=xml_body.encode("utf-8"),
                          headers={"Content-Type": "text/xml", "Accept": "text/xml",
                                   "User-Agent": UA},
                          method="POST")
                      with urllib.request.urlopen(req, timeout=120) as r:
                          return r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      last = e
                      log("  POST attempt %d failed: HTTP %s" % (attempt + 1, e.code))
                      # 403/429 = rate-limited: exponential backoff, generous.
                      if e.code in (403, 429):
                          time.sleep(min(60, 8 * (2 ** attempt)))
                      else:
                          time.sleep(3 * (attempt + 1))
                  except Exception as e:
                      last = e
                      log("  POST attempt %d failed: %s" % (attempt + 1, e))
                      time.sleep(3 * (attempt + 1))
              raise RuntimeError("POST failed after %d tries: %s" % (tries, last))

          def parse_records(xml_text):
              # Returns (recs, raw). recs is None on hard error (parse fail or API
              # <result>failure</result>); [] on a clean empty page.
              try:
                  root = ET.fromstring(xml_text)
              except ET.ParseError as e:
                  log("  XML parse error:", e)
                  log("  first 600 chars:", xml_text[:600])
                  return None, xml_text
              # API-level failure: dump every <message> so we can read the contract.
              result = None
              for el in root.iter():
                  if el.tag.lower() == "result":
                      result = (el.text or "").strip().lower()
                      break
              if result == "failure":
                  msgs = []
                  for m in root.iter():
                      if m.tag.lower() == "description":
                          msgs.append((m.text or "").strip())
                  log("  API returned failure. messages:")
                  for m in msgs:
                      log("    -", m)
                  return None, xml_text
              # log the API's own record_count when present (viewer-safe).
              for el in root.iter():
                  if el.tag.lower() == "record_count":
                      log("  [api record_count = %s]" % ((el.text or "").strip()))
                      break
              recs = []
              for rec in root.iter():
                  tl = rec.tag.lower()
                  if tl.endswith("record") and tl != "result_records":
                      d = {}
                      for child in rec:
                          d[child.tag.lower()] = (child.text or "").strip()
                      if d:
                          recs.append(d)
              return recs, xml_text

          def fetch_all(type_of_data, columns, base_criteria, fy, industry_server):
              rows = []
              raw_first = None
              rf = 1
              page = 0
              while True:
                  crit = list(base_criteria)
                  if fy is not None:
                      crit.append(("fiscal_year", "value", str(fy)))
                  if industry_server:
                      crit.append(("industry", "value", "Construction"))
                  xml = build_request_xml(type_of_data, columns, crit, rf)
                  resp = post(xml)
                  recs, raw = parse_records(resp)
                  if page == 0:
                      raw_first = raw
                  if recs is None:
                      time.sleep(0.7)   # pace even on a short-circuit failure
                      return rows, raw_first
                  rows.extend(recs)
                  got = len(recs)
                  page += 1
                  if got < MAX_RECORDS:
                      break
                  rf += MAX_RECORDS
                  time.sleep(1.0)   # pace paging to avoid 403 rate-limit
                  if rf > 300000:
                      log("  WARNING paging cap hit for", type_of_data, fy)
                      break
              time.sleep(0.7)       # pace between (domain, fy) combinations
              return rows, raw_first

          def to_int_amount(s):
              if not s:
                  return 0
              s = s.replace(",", "").replace("$", "").strip()
              try:
                  return int(round(float(s)))
              except ValueError:
                  return 0

          def load_aliases(path):
              with open(path) as f:
                  raw = json.load(f)
              v2p = {}
              for g in raw:
                  for v in g.get("variants", []):
                      nv = norm_name(v)
                      if nv:
                          v2p[nv] = g["parent"]
              return v2p

          alias_path = "site/data/vendor-aliases.json"
          if not os.path.exists(alias_path):
              alias_path = "data/vendor-aliases.json"
          variant_to_parent = load_aliases(alias_path)
          log("Loaded %d normalized variant keys from %s" % (len(variant_to_parent), alias_path))

          # Real API column + criterion names, locked from run #3's failure
          # messages (the doc-based names in the spec were wrong; the live API
          # returned its own valid lists):
          #   Contracts domain = "Registered Contracts(expense)", columns are
          #   prime_contract_* prefixed; there is NO returnable fiscal_year column
          #   (fiscal_year works only as a SEARCH criterion), so the output fiscal
          #   year is derived from prime_contract_registration_date.
          #   Spending domain rejects 'category' and a 'contract' spending_category
          #   (max 2 chars); vendor column is payee_name.
          contracts_cols = ["prime_vendor", "prime_contract_id", "prime_contracting_agency",
                            "prime_contract_industry", "prime_contract_current_amount",
                            "prime_contract_original_amount", "prime_contract_purpose",
                            "prime_contract_registration_date"]
          spending_cols = ["payee_name", "agency", "industry", "check_amount",
                           "contract_id", "document_id", "issue_date"]

          # category=expense + status=registered are both accepted on Contracts
          # (status valid values are 'pending,registered'). Spending takes neither
          # category nor a contract spending_category, so it is filtered by
          # fiscal_year (+ optional server-side industry) only.
          CONTRACTS_BASE = [("category", "value", "expense"),
                            ("status", "value", "registered")]
          SPENDING_BASE = []

          # Logical-field accessors map real API column names -> the names the
          # aggregation uses, so the aggregation logic stays unchanged.
          def c_name(r):    return r.get("prime_vendor", "")
          def c_cid(r):     return r.get("prime_contract_id", "") or ""
          def c_agency(r):  return r.get("prime_contracting_agency", "")
          def c_industry(r):return r.get("prime_contract_industry", "") or ""
          def c_amount(r):  return r.get("prime_contract_current_amount", "")
          def c_fy(r):
              # fiscal year derived from registration date (YYYY-MM-DD...).
              d = r.get("prime_contract_registration_date", "") or ""
              m = re.match(r"(\d{4})", d)
              return m.group(1) if m else ""
          def s_name(r):    return r.get("payee_name", "")
          def s_agency(r):  return r.get("agency", "")
          def s_industry(r):return r.get("industry", "") or ""
          def s_amount(r):  return r.get("check_amount", "")
          def s_fy(r):
              d = r.get("issue_date", "") or ""
              m = re.match(r"(\d{4})", d)
              return m.group(1) if m else ""

          # ---- probe: server-side industry filter needs a 2-char industry CODE
          # (run #4: "industry exceeds maximum allowed '2' characters"), which we
          # do not have, so we always take the CLIENT path and filter on the
          # returned industry text. The probe here is a plain no-industry Contracts
          # request whose only job is to surface the real record structure + the
          # first parsed record, so we can confirm field tags and that fiscal_year
          # returns rows.
          industry_mode = "client"
          server = False

          # ---- MATRIX PROBE: single-page request per (criteria) combo, logging
          # the API's own record_count, to find a combo that actually returns rows.
          def probe_combo(label, type_of_data, columns, criteria):
              xml = build_request_xml(type_of_data, columns, criteria, 1)
              resp = post(xml)
              recs, _ = parse_records(resp)
              n = -1 if recs is None else len(recs)
              log("  PROBE[%s] -> parsed_rows=%s" % (label, n))
              time.sleep(0.7)
              return recs

          log("=== MATRIX PROBE (Contracts status/category variants) ===")
          probe_combo("exp+registered+fy2024", "Contracts", contracts_cols,
                      [("category","value","expense"),("status","value","registered"),
                       ("fiscal_year","value","2024")])
          probe_combo("exp+registered (no fy)", "Contracts", contracts_cols,
                      [("category","value","expense"),("status","value","registered")])
          probe_combo("exp+pending (no fy)", "Contracts", contracts_cols,
                      [("category","value","expense"),("status","value","pending")])
          probe_combo("registered only (no category)", "Contracts", contracts_cols,
                      [("status","value","registered")])
          probe_combo("registered+records_from0-style fy2023", "Contracts", contracts_cols,
                      [("category","value","expense"),("status","value","registered"),
                       ("fiscal_year","value","2023")])
          log("=== MATRIX PROBE (Spending variants) ===")
          probe_combo("spending fy2024 only", "Spending", spending_cols,
                      [("fiscal_year","value","2024")])
          probe_combo("spending no criteria", "Spending", spending_cols, [])

          # Probe A: Contracts WITH fiscal_year (run #4 returned 0 here).
          log("=== PROBE A: Contracts WITH fiscal_year=%d ===" % FYS[-1])
          probeA, rawA = fetch_all("Contracts", contracts_cols, CONTRACTS_BASE, FYS[-1], industry_server=False)
          log("  probe A returned %d contract rows" % len(probeA))
          log("  raw A first 1200:", (rawA or "")[:1200])
          # Probe B: Contracts WITHOUT fiscal_year (all registered expense contracts).
          log("=== PROBE B: Contracts WITHOUT fiscal_year (fy=None) ===")
          probeB, rawB = fetch_all("Contracts", contracts_cols, CONTRACTS_BASE, None, industry_server=False)
          log("  probe B returned %d contract rows" % len(probeB))
          log("=== SAMPLE raw Contracts (no-fy) first-page XML (first 3500 chars) ===")
          log((rawB or "")[:3500])
          # Pick whichever path yields rows; prefer the per-FY filter, else pull-all.
          contracts_use_fy = bool(probeA)
          probe_rows = probeA if probeA else probeB
          log("  -> contracts_use_fy =", contracts_use_fy, "| industry_filter_mode =", industry_mode)
          if probe_rows:
              log("=== FIRST parsed Contracts record (keys -> value) ===")
              for k, v in list(probe_rows[0].items()):
                  log("    %s = %r" % (k, v[:80] if isinstance(v, str) else v))
          # also dump a Spending sample so we can confirm its record shape
          log("=== PROBE: plain Spending FY%d, raw dump ===" % FYS[-1])
          sp_probe, sp_raw = fetch_all("Spending", spending_cols, SPENDING_BASE, FYS[-1], industry_server=False)
          log("  spending probe returned %d rows" % len(sp_probe))
          log("=== SAMPLE raw Spending first-page XML (first 2500 chars) ===")
          log((sp_raw or "")[:2500])
          if sp_probe:
              log("=== FIRST parsed Spending record (keys -> value) ===")
              for k, v in list(sp_probe[0].items()):
                  log("    %s = %r" % (k, v[:80] if isinstance(v, str) else v))

          FYSET = set(str(y) for y in FYS)
          all_contracts, all_spending = [], []
          if contracts_use_fy:
              for fy in FYS:
                  log("--- Contracts FY%d ---" % fy)
                  rows, _ = fetch_all("Contracts", contracts_cols, CONTRACTS_BASE, fy, industry_server=server)
                  log("  %d contract rows" % len(rows))
                  all_contracts.extend(rows)
          else:
              # Pull ALL registered expense contracts once, filter to the 5-FY
              # window client-side by derived registration-date year.
              log("--- Contracts (all registered, fy filtered client-side) ---")
              rows, _ = fetch_all("Contracts", contracts_cols, CONTRACTS_BASE, None, industry_server=server)
              log("  %d total contract rows pulled" % len(rows))
              rows = [r for r in rows if c_fy(r) in FYSET]
              log("  %d contract rows within FY%s-%s" % (len(rows), FYS[0], FYS[-1]))
              all_contracts.extend(rows)
          for fy in FYS:
              log("--- Spending FY%d ---" % fy)
              rows, _ = fetch_all("Spending", spending_cols, SPENDING_BASE, fy, industry_server=server)
              log("  %d spending rows" % len(rows))
              all_spending.extend(rows)

          industries_seen = {}
          for r in all_contracts:
              ind = c_industry(r)
              if ind:
                  industries_seen[ind] = industries_seen.get(ind, 0) + 1
          for r in all_spending:
              ind = s_industry(r)
              if ind:
                  industries_seen[ind] = industries_seen.get(ind, 0) + 1
          log("=== DISTINCT industry values (count -> value) ===")
          for k in sorted(industries_seen, key=lambda x: -industries_seen[x]):
              log("  %8d  %s" % (industries_seen[k], k))

          def keep_c(r):
              return True if server else bool(CONSTR_RE.search(c_industry(r)))
          def keep_s(r):
              return True if server else bool(CONSTR_RE.search(s_industry(r)))

          contracts = [r for r in all_contracts if keep_c(r)]
          spending = [r for r in all_spending if keep_s(r)]
          log("After construction filter: contracts=%d spending=%d (mode=%s)"
              % (len(contracts), len(spending), industry_mode))

          def resolve(name):
              k = norm_name(name)
              parent = variant_to_parent.get(k)
              if parent:
                  return parent, True
              return (name or "").strip(), False

          groups = {}
          def group_for(label, matched):
              g = groups.get(label)
              if g is None:
                  g = {"label": label, "matched": matched, "registered": 0, "paid": 0,
                       "agencies": set(), "fy_first": None, "fy_last": None, "_cm": {}}
                  groups[label] = g
              return g
          def upd_fy(g, fy):
              try:
                  fyi = int(str(fy)[:4])
              except (ValueError, TypeError):
                  return
              if g["fy_first"] is None or fyi < g["fy_first"]:
                  g["fy_first"] = fyi
              if g["fy_last"] is None or fyi > g["fy_last"]:
                  g["fy_last"] = fyi

          for r in contracts:
              name = c_name(r)
              if not name:
                  continue
              label, matched = resolve(name)
              g = group_for(label, matched)
              if matched:
                  g["matched"] = True
              cid = c_cid(r)
              amt = to_int_amount(c_amount(r))
              fy = c_fy(r)
              try:
                  fyi = int(fy[:4]) if fy else 0
              except (ValueError, TypeError):
                  fyi = 0
              ag = c_agency(r)
              if ag:
                  g["agencies"].add(ag)
              upd_fy(g, fy)
              if cid:
                  prev = g["_cm"].get(cid)
                  if prev is None or (fyi, amt) > prev:
                      g["_cm"][cid] = (fyi, amt)
              else:
                  g["_cm"]["__nocid_%d_%d" % (len(g["_cm"]), amt)] = (fyi, amt)

          for r in spending:
              name = s_name(r)
              if not name:
                  continue
              label, matched = resolve(name)
              g = group_for(label, matched)
              if matched:
                  g["matched"] = True
              g["paid"] += to_int_amount(s_amount(r))
              ag = s_agency(r)
              if ag:
                  g["agencies"].add(ag)
              upd_fy(g, s_fy(r))

          for g in groups.values():
              g["registered"] = sum(v[1] for v in g["_cm"].values())

          vendors = {}
          total_registered = total_paid = 0
          for label, g in groups.items():
              key = norm_name(label)
              if not key:
                  continue
              rec = {"label": g["label"], "registered": int(g["registered"]), "paid": int(g["paid"]),
                     "agencies": len(g["agencies"]), "fy_first": g["fy_first"], "fy_last": g["fy_last"],
                     "matched": bool(g["matched"])}
              if key in vendors and vendors[key]["registered"] >= rec["registered"]:
                  continue
              vendors[key] = rec

          for rec in vendors.values():
              total_registered += rec["registered"]
              total_paid += rec["paid"]

          group_count = len(vendors)
          truncated = False
          raw_estimate = len(json.dumps({"vendors": vendors}))
          if group_count > 1500 or raw_estimate > 150 * 1024:
              items = sorted(vendors.items(), key=lambda kv: -kv[1]["registered"])[:300]
              vendors = dict(items)
              truncated = True

          meta = {"generated": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "source": "Checkbook NYC API (checkbooknyc.com)", "fiscal_years": FYS,
                  "industry_filter_mode": industry_mode, "contracts_rows": len(contracts),
                  "spending_rows": len(spending), "groups": group_count}
          if truncated:
              meta["truncated"] = True
          out = {"meta": meta, "vendors": vendors}

          log("=== SUMMARY ===")
          log("contracts_rows=%d spending_rows=%d groups=%d mode=%s"
              % (len(contracts), len(spending), group_count, industry_mode))
          log("total registered = $%d  total paid = $%d" % (total_registered, total_paid))
          cruz_key = norm_name("E.E. Cruz / JRCruz")
          log("Cruz key = %r -> %s" % (cruz_key, json.dumps(vendors.get(cruz_key, "MISSING"))))
          tp_key = norm_name("Tutor Perini")
          log("Tutor Perini key = %r -> %s" % (tp_key, json.dumps(vendors.get(tp_key, "MISSING"))))

          assert len(contracts) > 0, "contracts_rows == 0 (partial/failed fetch)"
          assert len(spending) > 0, "spending_rows == 0 (partial/failed fetch)"
          assert group_count >= 50, "groups < 50 (too few; partial fetch?)"
          assert total_registered >= 1_000_000_000, "total registered < $1B (degraded pull)"

          with open("data/checkbook-vendors.json", "w") as f:
              json.dump(out, f, separators=(",", ":"), ensure_ascii=False)
          log("Wrote data/checkbook-vendors.json (%d bytes, %d vendors)"
              % (os.path.getsize("data/checkbook-vendors.json"), len(vendors)))
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "concrete-index-checkbook"
          git config user.email "actions@users.noreply.github.com"
          git add data/checkbook-vendors.json
          git diff --cached --quiet && echo "No changes today" || {
            git commit -m "Checkbook vendor data $(date -u +%Y-%m-%d)"
            git push
          }
